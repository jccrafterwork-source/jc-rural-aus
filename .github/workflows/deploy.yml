name: Deploy to Manus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Type check
        run: pnpm run check
      
      - name: Build project
        run: pnpm run build
      
      - name: Verify build output
        run: |
          if [ ! -d "dist/public" ]; then
            echo "Build failed: dist/public directory not found"
            exit 1
          fi
          echo "✓ Build successful"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "✓ Deployment triggered for commit: ${{ github.sha }}"
          echo "✓ Branch: ${{ github.ref }}"
          echo "✓ Author: ${{ github.actor }}"
          echo ""
          echo "Manus webdev will automatically detect and deploy this push."
          echo "Visit your live site to verify the changes:"
          echo "→ https://jcruralaus-gy2gepc3.manus.space"
